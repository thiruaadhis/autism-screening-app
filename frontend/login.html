<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Medzilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/medical-theme.css">
</head>
<body>
    <script>
        (function() {
            const reduceMotion = localStorage.getItem('setting_reduceMotion') === 'true';
            const dyslexiaFont = localStorage.getItem('setting_dyslexiaFont') === 'true';
            const lightMode = localStorage.getItem('setting_lightMode') === 'true';
            if (reduceMotion) document.body.classList.add('reduce-motion');
            if (dyslexiaFont) document.body.classList.add('dyslexia-mode');
            if (lightMode) document.body.classList.add('light-mode');
        })();
    </script>

<div class="result-wrapper">
    <div class="result-card auth-box" style="max-width: 440px; height: auto; padding: 36px 40px;">

        <div class="brand-logo-auth">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#eaeaea"><path d="M12 2a5 5 0 1 0 0 10A5 5 0 0 0 12 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>
            <span>Medzilla</span>
        </div>

        <h2 style="margin: 18px 0 6px 0; font-size: 22px;">Welcome back</h2>
        <p style="color: #a0a0a0; font-size: 13px; margin-bottom: 22px;">Sign in to your account to continue</p>

        <input id="email" placeholder="Email" class="input-field">

        <div class="password-box">
            <input id="password" type="password" placeholder="Password" class="input-field">
            <svg id="eye" onclick="togglePassword('password')" viewBox="0 0 24 24" class="eye-icon">
                <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
            </svg>
        </div>

        <div id="login-error" class="error-message"></div>
        <div id="login-success" class="success-message"></div>

        <button onclick="login()" style="margin-top: 8px; width: 100%;">Sign In</button>

        <p class="switch-auth" onclick="goSignup()">Don't have an account? Create one</p>
    </div>
</div>

<div id="authModal" class="modal hidden">
    <div class="modal-card">
        <p id="modalText"></p>
        <button id="createAccountBtn" onclick="goSignup()" style="display: none; margin-bottom: 10px;">Create Account</button>
        <button onclick="closeModal()" style="background: #444; color: white;">Close</button>
    </div>
</div>

<script src="js/api.js?v=3"></script>
<script src="js/login.js?v=4"></script>
</body>
</html>
