<!DOCTYPE html>
<html>
<head>
    <title>Screening Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/medical-theme.css">
</head>
<body>

<div class="dashboard-container">
    <aside id="sidebar" class="sidebar">
        <div>
            <div class="sidebar-header">Medzilla</div>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    Home
                </a>
                <a href="questionnaire.html" class="nav-link active">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>
                    Autism Test
                </a>
                <a href="upload.html" class="nav-link">
                    <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                    Video Analysis
                </a>
            </div>
        </div>
        
        <div class="sidebar-footer">
            <button class="sidebar-logout-btn" onclick="logout()">
                <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                Logout
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <button class="menu-btn" onclick="toggleSidebar()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <div class="user-profile">
                <span id="greetingText">Hi, User</span>
                <div id="avatarLetter" class="avatar">U</div>
            </div>
        </header>

        <div class="result-wrapper">
            <div class="result-card">
                <h2>Screening Result</h2>

                <h1 id="score"></h1>
                <p id="interpretation"></p>

                <button onclick="window.location.href='questionnaire.html'">Test Again</button>

                <p class="disclaimer">
                    This is a screening tool and does not provide a medical diagnosis.
                    Please consult a healthcare professional for proper evaluation.
                </p>
            </div>
        </div>
    </main>
</div>

<script src="js/dashboard.js"></script>
<script src="js/results.js"></script>

</body>
</html>
