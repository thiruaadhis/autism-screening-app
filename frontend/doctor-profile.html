<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Medzilla Doctor</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/medical-theme.css">
    <script>
        (function() {
            const reduceMotion = localStorage.getItem('setting_reduceMotion') === 'true';
            const dyslexiaFont = localStorage.getItem('setting_dyslexiaFont') === 'true';
            const lightMode = localStorage.getItem('setting_lightMode') === 'true';
            if (reduceMotion) document.documentElement.classList.add('reduce-motion');
            if (dyslexiaFont) document.documentElement.classList.add('dyslexia-mode');
            if (lightMode) document.documentElement.classList.add('light-mode');
        })();
    </script>
</head>
<body>
<script>document.body.className = document.documentElement.className;</script>

<div class="dashboard-container">
    <aside id="sidebar" class="sidebar">
        <div>
            <div class="sidebar-header">
                <button class="menu-btn" onclick="toggleSidebar()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
            </div>
            <div class="nav-links">
                <a href="doctor-dashboard.html" class="nav-link">
                    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    <span>Dashboard</span>
                </a>

                <a href="doctor-profile.html" class="nav-link active">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
                    <span>My Profile</span>
                </a>
            </div>
        </div>
        <div class="sidebar-footer">
            <a href="doctor-settings.html" class="nav-link" style="font-size: 14px;">
                <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                <span>Settings</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h1 class="brand-title">Medzilla</h1>
        </header>

        <section class="content-area" style="max-width:820px;">

            <!-- Profile Header -->
            <div class="doctor-profile-header">
                <div class="doctor-profile-avatar" id="profile-avatar-letter">D</div>
                <div>
                    <h2 id="profile-display-name" style="margin:0; font-size:22px;">—</h2>
                    <p id="profile-display-spec" style="color:#eaeaea; margin:4px 0; font-size:14px;">—</p>
                    <div class="star-display" id="profile-star-display">
                        <span id="profile-avg-stars"></span>
                        <span id="profile-rating-text" style="color:#a0a0a0; font-size:13px; margin-left:8px;"></span>
                    </div>
                </div>
            </div>

            <!-- Edit Form -->
            <div class="info-card" style="margin-top:20px;">
                <h3 style="margin-top:0; margin-bottom:20px; font-size:16px; color:#eaeaea;">Edit Profile Information</h3>

                <div class="profile-field-group">
                    <label class="profile-field-label">Display Name</label>
                    <input id="field-name" class="input-field" placeholder="e.g. Dr. Sarah Chen">
                </div>
                <div class="profile-field-group">
                    <label class="profile-field-label">Specialization</label>
                    <input id="field-spec" class="input-field" placeholder="e.g. Pediatric Neurologist">
                </div>
                <div class="profile-field-group">
                    <label class="profile-field-label">Clinic / Hospital Name</label>
                    <input id="field-clinic" class="input-field" placeholder="e.g. Sunshine Children's Clinic">
                </div>
                <div class="profile-field-group">
                    <label class="profile-field-label">Clinic Address</label>
                    <input id="field-address" class="input-field" placeholder="e.g. 123 Main Street, Chennai 600001">
                </div>
                <div class="profile-field-group">
                    <label class="profile-field-label">Professional Bio</label>
                    <textarea id="field-bio" class="input-field" rows="4" placeholder="Brief description of your expertise and approach…" style="resize:vertical; line-height:1.6;"></textarea>
                </div>

                <div id="profile-save-msg" class="error-message" style="display:none;"></div>
                <button onclick="saveProfile()" style="margin-top:8px;">Save Changes</button>
            </div>

            <!-- Ratings Section -->
            <div class="info-card" style="margin-top:20px;">
                <h3 style="margin-top:0; margin-bottom:16px; font-size:16px; color:#eaeaea;">Parent Reviews</h3>
                <div id="ratings-container">
                    <p style="color:#a0a0a0; font-size:14px; text-align:center;">No reviews yet.</p>
                </div>
            </div>

            <!-- Logout -->
            <div class="info-card" style="margin-top:20px; padding: 20px 40px;">
                <div class="setting-item" style="border-bottom: none; padding: 0; align-items: center;">
                    <div class="setting-info">
                        <div class="setting-label" style="color: #dc143c;">End Session</div>
                        <div class="setting-desc">Sign out of your current Medzilla session.</div>
                    </div>
                    <div class="action-column">
                        <button onclick="logout()" style="margin: 0; background: transparent; border: 1px solid #dc143c; color: #dc143c; padding: 10px 20px; font-size: 14px; border-radius: 10px; display: flex; align-items: center; gap: 8px;">
                            <svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink: 0;"><path fill="#dc143c" d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                            Logout
                        </button>
                    </div>
                </div>
            </div>

        </section>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/doctor-profile.js"></script>
<script>
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
function logout() { localStorage.removeItem('currentUser'); window.location.replace('login.html'); }
</script>
</body>
</html>
