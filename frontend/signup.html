<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/medical-theme.css">
</head>

<body>

<div class="result-wrapper">
    <div class="result-card auth-box">

        <h2>Create Account</h2>

        <input id="email" placeholder="Email" class="input-field">
        
        <div class="password-box">
            <input id="password" type="password" placeholder="Password" class="input-field">
            <svg id="eye-password" onclick="togglePassword('password', 'eye-password')" viewBox="0 0 24 24" class="eye-icon">
                <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
            </svg>
        </div>

        <div class="password-box">
            <input id="verify-password" type="password" placeholder="Verify Password" class="input-field">
            <svg id="eye-verify" onclick="togglePassword('verify-password', 'eye-verify')" viewBox="0 0 24 24" class="eye-icon">
                <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
            </svg>
        </div>

        <div id="signup-error" class="error-message"></div>

        <button onclick="signup()">Create Account</button>

        <p class="switch-auth" onclick="goLogin()">Already have an account? Login</p>

    </div>
</div>

<div id="authModal" class="modal hidden">
    <div class="modal-card">
        <p id="modalText"></p>
        <button onclick="closeModal()" style="background: #444; color: white;">Close</button>
    </div>
</div>

<script src="js/signup.js"></script>

</body>
</html>
